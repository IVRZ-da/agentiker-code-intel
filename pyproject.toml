[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "agentiker-code-intel"
version = "0.6.25"
description = "AST-aware code intelligence for Hermes Agent — tree-sitter + ast-grep + LSP"
authors = [
    {name = "Johannes Lettner"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # tree-sitter core — exakt gepinnt: Query/Cursor-API aendert sich zwischen Minor-Versionen
    # (siehe Pattern 25 in skills/SKILL.md: Query.captures() -> QueryCursor.matches()).
    "tree-sitter==0.26.1",
    "ast-grep-py==0.51.1",
    # Grammatik-Pakete — ohne sie liefern ALLE AST-Tools leere Ergebnisse bzw. fallen
    # komplett aus ("Tree-sitter not available"). Versionen = verifizierter Stand.
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-java==0.23.5",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-xdist",
    "pytest-timeout>=2.3.0",
    "pytest-forked>=1.6.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
include = ["code_intel", "code_intel.*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
# --dist loadfile: eine Testdatei laeuft komplett in EINEM Worker. Mit dem frueheren
# --dist loadscope wurden Klassen derselben Datei auf verschiedene Worker verteilt;
# die LSP-Tests teilen sich aber Modul-State (Bridge-Pool, gepatchte Module) und
# schlugen dann sporadisch fehl (11 Failures, einzeln alle gruen).
addopts = "-n auto --dist loadfile --cov-config=.coveragerc --cov=code_intel --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: Tests requiring LSP server or heavy AST operations",
]

[[tool.pyright]]
reportMissingImports = false
reportMissingTypeStubs = false
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "T201"]
"lsp_bridge.py" = ["F405", "F822"]
"tests/*" = ["E402"]
"lsp/bridge.py" = ["E402", "F822"]
"lsp/bridge/server.py" = ["E402"]
"lsp/bridge/__init__.py" = ["F811", "F822"]
"lsp/bridge/pool.py" = ["F822"]

[tool.ruff]
line-length = 120

[tool.coverage.run]
source = ["code_intel"]
omit = ["tests/*", "scripts/*"]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]
