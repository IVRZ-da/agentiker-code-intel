name: agentiker-code-intel
version: 0.6.39
description: "agentiker-code-intel — AST-aware code intelligence: symbol extraction, structural search, safe refactoring, LSP go-to-definition and find-all-references (tree-sitter + ast-grep + LSP)"
author: "Johannes Lettner"
license: MIT
repo: https://git.agentiker.de/johannes/agentiker-code-intel
requires_hermes: ">=0.23.1"
hooks:
  - on_session_end
  - pre_llm_call
  - post_tool_call
# Python-Abhaengigkeiten (Quelle ist primaer pyproject.toml; dieses Feld wird von
# Hermes validiert und angezeigt, nie automatisch installiert).
# Nach einem Hermes-Update (neue Runtime-venv!) pruefen:
#   hermes pm repair   oder   uv pip install --python <runtime-venv>/bin/python -e .
python_dependencies:
  - "tree-sitter==0.26.1"
  - "ast-grep-py==0.51.1"
  - "tree-sitter-python==0.25.0"
  - "tree-sitter-typescript==0.23.2"
  - "tree-sitter-javascript==0.25.0"
  - "tree-sitter-go==0.25.0"
  - "tree-sitter-rust==0.24.2"
  - "tree-sitter-java==0.23.5"
  - "rich>=13.0,<15"
  - "PyYAML>=6.0,<7"
# Deklarierte Faehigkeiten fuer den Hermes-Plugin-Katalog (`hermes plugins validate`).
# Der Validator vergleicht `provides_*` mit dem, was register() tatsaechlich registriert:
#   undeclared  (registriert, aber nicht deklariert) -> harter Fehler
#   unregistered (deklariert, aber nicht registriert) -> nur Warnung
# Default-Betrieb sind die 7 Namespace-Dispatcher (siehe namespaces.py). Die 70
# Einzel-Tools existieren nur mit CODE_INTEL_NAMESPACES=0 und sind hier BEWUSST
# nicht deklariert — in diesem Modus ist das Plugin nicht katalogfaehig (der
# Validator meldet dann 70 undeclared Tools). Siehe tests/test_manifest_capabilities.py.
provides_tools:
  - code_search
  - code_lsp
  - code_graph
  - code_edit
  - code_review
  - code_git
  - code_meta
provides_hooks:
  - on_session_end
  - pre_llm_call
  - post_tool_call
